<div class="trainpay">
    <h1>Мои оплаты</h1>

    <input type="search" id="trainpay-search" placeholder="Поиск по названию тренинга">
    <select id="trainpay-sort">
        <option value="id">Сначала новые</option>
        <option value="amount">По сумме</option>
        <option value="title">По названию</option>
    </select>

    <div id="trainpay-list">
        {foreach $payments as $p}
            <div class="payment">
                <h3><a href="{$p.id}/">{$p.title}</a></h3>
                <span class="amount">{$p.amount}</span>
                <span class="status">{$p.status}</span>
                {if $p.status == 'paid'}
                    <form class="refund" method="post" action="refund/">
                        <input type="hidden" name="payment_id" value="{$p.id}">
                        <input type="text" name="reason" placeholder="Причина возврата">
                        <button type="submit">Запросить возврат</button>
                    </form>
                {/if}
            </div>
        {foreachelse}
            <p>Оплат пока нет.</p>
        {/foreach}
    </div>
</div>

<script src="{$wa_app_static_url}js/trainpay.js"></script>
